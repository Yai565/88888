<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>AR ลิงโหม่งกล้วย 🐵🍌</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">

<!-- A-Frame + AR.js (marker based) -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%;
    font-family: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent; user-select: none; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex;
    justify-content: space-between; align-items: center; padding: 12px 14px; pointer-events: none; }
  .pill { background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 8px 18px;
    font-size: 18px; font-weight: 700; backdrop-filter: blur(6px); }
  #score { color: #ffd93b; }

  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
    background: rgba(0,0,0,.65); color: #fff; padding: 18px 22px; border-radius: 18px;
    text-align: center; font-size: 17px; line-height: 1.5; max-width: 80vw; pointer-events: none;
    transition: opacity .25s; }
  #hint b { color: #ffd93b; }
  #hint.hidden { opacity: 0; }

  /* ---------- Buttons ---------- */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 12px;
    justify-content: center; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); }
  button { font-family: inherit; font-weight: 800; border: 0; border-radius: 18px; cursor: pointer;
    color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.25), 0 10px 20px rgba(0,0,0,.25);
    transition: transform .08s, box-shadow .08s, opacity .2s; }
  button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #jumpBtn { flex: 2; max-width: 280px; padding: 16px 10px; font-size: 20px;
    background: linear-gradient(#ffb300, #ff8f00); }
  #endBtn { flex: 1; max-width: 140px; padding: 16px 10px; font-size: 18px;
    background: linear-gradient(#ff5d6c, #e53950); }

  /* ---------- +10 popup ---------- */
  .plus { position: fixed; left: 50%; top: 38%; z-index: 25; font-size: 48px; font-weight: 900;
    color: #ffe14d; text-shadow: 0 3px 0 #b36b00, 0 0 18px rgba(255,200,0,.8); pointer-events: none;
    animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp {
    0%   { transform: translate(-50%, 0) scale(.5); opacity: 0; }
    20%  { transform: translate(-50%, -20px) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -120px) scale(1); opacity: 0; }
  }

  /* ---------- Fireworks ---------- */
  #fw { position: fixed; inset: 0; z-index: 30; pointer-events: none; }

  /* ---------- End panel ---------- */
  #endPanel { position: fixed; inset: 0; z-index: 40; display: none; align-items: center;
    justify-content: center; background: rgba(0,0,0,.35); }
  #endPanel.show { display: flex; }
  .card { background: #fff; border-radius: 26px; padding: 26px 30px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.4); animation: pop .5s cubic-bezier(.2,1.4,.4,1); max-width: 82vw; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h2 { margin: 0 0 4px; font-size: 28px; color: #e53950; }
  .card .big { font-size: 64px; font-weight: 900; color: #ff8f00; line-height: 1.1; }
  .card p { margin: 6px 0 18px; color: #555; font-size: 18px; }
  #replayBtn { padding: 14px 28px; font-size: 20px; background: linear-gradient(#35c759, #22a646); }

  /* A-Frame fullscreen video fix */
  .a-enter-vr { display: none !important; }
</style>
</head>

<body>
<!-- ========== AR SCENE ========== -->
<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium; alpha: true;"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">

  <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
  <a-light type="directional" color="#fff4e0" intensity="0.9" position="1 3 2"></a-light>

  <a-marker id="marker" preset="hiro" smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="5">

    <!-- เงาใต้ตัวลิง -->
    <a-circle id="shadow" radius="0.28" rotation="-90 0 0" position="0 0.003 0.02"
              color="#000" opacity="0.28"></a-circle>

    <!-- ===== ตัวลิง (หันหน้าไปทาง +Z = หาผู้ใช้) ===== -->
    <a-entity id="monkey" position="0 0 0" scale="1 1 1">

      <!-- หาง -->
      <a-torus position="0 0.22 -0.26" rotation="0 90 0" radius="0.14" radius-tubular="0.026"
               arc="260" color="#7a4b22" segments-radial="10" segments-tubular="28"></a-torus>

      <!-- ขา -->
      <a-sphere position="-0.14 0.1 0.06" radius="0.12" scale="1 0.85 1.5" color="#7a4b22"></a-sphere>
      <a-sphere position="0.14 0.1 0.06" radius="0.12" scale="1 0.85 1.5" color="#7a4b22"></a-sphere>
      <a-sphere position="-0.14 0.06 0.17" radius="0.07" scale="1.1 0.6 1" color="#e9c49b"></a-sphere>
      <a-sphere position="0.14 0.06 0.17" radius="0.07" scale="1.1 0.6 1" color="#e9c49b"></a-sphere>

      <!-- ลำตัว + ท้อง -->
      <a-sphere position="0 0.4 0" radius="0.26" scale="1 1.1 0.9" color="#8d5a2b"
                segments-width="32" segments-height="24"></a-sphere>
      <a-sphere position="0 0.38 0.12" radius="0.19" scale="1 1.1 0.55" color="#efcfa8"></a-sphere>

      <!-- แขนซ้าย (pivot ที่หัวไหล่) -->
      <a-entity id="armL" position="-0.27 0.55 0.04" rotation="0 0 -15">
        <a-sphere position="0 -0.14 0" radius="0.07" scale="1 2.2 1" color="#8d5a2b"></a-sphere>
        <a-sphere position="0 -0.3 0.01" radius="0.075" color="#efcfa8"></a-sphere>
      </a-entity>
      <!-- แขนขวา -->
      <a-entity id="armR" position="0.27 0.55 0.04" rotation="0 0 15">
        <a-sphere position="0 -0.14 0" radius="0.07" scale="1 2.2 1" color="#8d5a2b"></a-sphere>
        <a-sphere position="0 -0.3 0.01" radius="0.075" color="#efcfa8"></a-sphere>
      </a-entity>

      <!-- หัว -->
      <a-sphere position="0 0.86 0" radius="0.25" color="#8d5a2b"
                segments-width="32" segments-height="24"></a-sphere>

      <!-- หู -->
      <a-sphere position="-0.25 0.9 -0.01" radius="0.09" scale="1 1 0.6" color="#8d5a2b"></a-sphere>
      <a-sphere position="-0.25 0.9 0.02" radius="0.058" scale="1 1 0.5" color="#f3b9a0"></a-sphere>
      <a-sphere position="0.25 0.9 -0.01" radius="0.09" scale="1 1 0.6" color="#8d5a2b"></a-sphere>
      <a-sphere position="0.25 0.9 0.02" radius="0.058" scale="1 1 0.5" color="#f3b9a0"></a-sphere>

      <!-- หน้า (หัวใจเนื้อสีอ่อน = 2 พู + ปาก) -->
      <a-sphere position="-0.075 0.89 0.15" radius="0.12" scale="1 0.95 0.7" color="#efcfa8"></a-sphere>
      <a-sphere position="0.075 0.89 0.15" radius="0.12" scale="1 0.95 0.7" color="#efcfa8"></a-sphere>
      <a-sphere position="0 0.8 0.17" radius="0.12" scale="1.15 0.85 0.8" color="#f4d9b6"></a-sphere>

      <!-- ตา -->
      <a-sphere position="-0.085 0.9 0.215" radius="0.05" color="#ffffff"></a-sphere>
      <a-sphere position="0.085 0.9 0.215" radius="0.05" color="#ffffff"></a-sphere>
      <a-sphere position="-0.085 0.9 0.255" radius="0.03" color="#1b1109"></a-sphere>
      <a-sphere position="0.085 0.9 0.255" radius="0.03" color="#1b1109"></a-sphere>
      <a-sphere position="-0.075 0.912 0.282" radius="0.01" color="#ffffff"></a-sphere>
      <a-sphere position="0.095 0.912 0.282" radius="0.01" color="#ffffff"></a-sphere>

      <!-- จมูก + ปาก + แก้ม -->
      <a-sphere position="-0.02 0.835 0.27" radius="0.01" color="#3b2412"></a-sphere>
      <a-sphere position="0.02 0.835 0.27" radius="0.01" color="#3b2412"></a-sphere>
      <a-torus position="0 0.815 0.268" rotation="0 0 180" radius="0.04" radius-tubular="0.006"
               arc="180" color="#5b2a1c"></a-torus>
      <a-sphere position="-0.155 0.82 0.2" radius="0.032" scale="1 .7 .4" color="#f29a8a" opacity="0.7"></a-sphere>
      <a-sphere position="0.155 0.82 0.2" radius="0.032" scale="1 .7 .4" color="#f29a8a" opacity="0.7"></a-sphere>

      <!-- ผมกระจุกบนหัว -->
      <a-sphere position="0 1.1 0.02" radius="0.04" scale="1 1.6 1" color="#6a3f1b"></a-sphere>
    </a-entity>

    <!-- ===== กล้วยลอยเหนือหัว ===== -->
    <a-entity id="banana" position="0 1.4 0">
      <a-entity animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true">
        <a-entity rotation="0 0 210">
          <a-torus radius="0.14" radius-tubular="0.04" arc="120" color="#ffd62b"
                   segments-radial="12" segments-tubular="28"></a-torus>
          <a-sphere position="0.14 0 0" radius="0.032" color="#4a3213"></a-sphere>
          <a-sphere position="-0.07 0.1212 0" radius="0.032" color="#4a3213"></a-sphere>
        </a-entity>
      </a-entity>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<!-- ========== UI ========== -->
<div id="hud">
  <div class="pill">🍌 คะแนน: <span id="score">0</span></div>
  <div class="pill" id="count">0 ครั้ง</div>
</div>

<div id="hint">📷 ส่องกล้องไปที่ <b>Marker Hiro</b><br>เพื่อเรียกน้องลิงออกมา 🐵</div>

<div id="controls">
  <button id="jumpBtn" disabled>🐵 กระโดดโหม่งกล้วย! +10</button>
  <button id="endBtn" disabled>🏁 จบเกม</button>
</div>

<canvas id="fw"></canvas>

<div id="endPanel">
  <div class="card">
    <h2>🎉 จบเกม! 🎉</h2>
    <div>คะแนนรวมของคุณ</div>
    <div class="big" id="finalScore">0</div>
    <p id="rank"></p>
    <button id="replayBtn">🔄 เล่นใหม่</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rad = d => d * Math.PI / 180;

  let score = 0, hits = 0;
  let visible = false, busy = false, ended = false;

  const marker = $('marker');
  const monkey = $('monkey'), banana = $('banana'), shadow = $('shadow');
  const armL = $('armL'), armR = $('armR');
  const jumpBtn = $('jumpBtn'), endBtn = $('endBtn');
  const BANANA_Y = 1.4;

  /* ---------- helpers ---------- */
  function tween(ms, fn) {
    return new Promise(res => {
      const t0 = performance.now();
      (function step(now) {
        const p = Math.min((now - t0) / ms, 1);
        fn(p);
        p < 1 ? requestAnimationFrame(step) : res();
      })(t0);
      // first frame
      requestAnimationFrame(() => {});
    });
  }
  function setArms(deg) {
    armR.object3D.rotation.z = rad(deg);
    armL.object3D.rotation.z = -rad(deg);
  }

  /* ---------- sound (WebAudio, no files needed) ---------- */
  let actx;
  function beep(freq = 600, dur = 0.12, type = 'square', vol = 0.06, when = 0) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime + when);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + when + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + when); o.stop(actx.currentTime + when + dur);
    } catch (e) {}
  }
  const sfxJump = () => { beep(380, .12, 'sine', .08); beep(560, .14, 'sine', .08, .08); };
  const sfxHit  = () => { beep(880, .1, 'square', .07); beep(1320, .18, 'square', .07, .08); };
  const sfxWin  = () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .25, 'triangle', .09, i * .14));

  /* ---------- UI state ---------- */
  function refreshButtons() {
    jumpBtn.disabled = !visible || ended;
    endBtn.disabled  = ended || hits === 0 && !visible;
  }
  marker.addEventListener('markerFound', () => {
    visible = true; $('hint').classList.add('hidden'); refreshButtons();
  });
  marker.addEventListener('markerLost', () => {
    visible = false; if (!ended) $('hint').classList.remove('hidden'); refreshButtons();
  });

  function popup(text) {
    const el = document.createElement('div');
    el.className = 'plus'; el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  /* ---------- game actions ---------- */
  async function hitBanana() {
    score += 10; hits++;
    $('score').textContent = score;
    $('count').textContent = hits + ' ครั้ง';
    popup('+10');
    sfxHit();
    endBtn.disabled = false;

    // กล้วยเด้งขึ้นพร้อมหมุน
    await tween(450, p => {
      const s = Math.sin(Math.PI * p);
      banana.object3D.position.y = BANANA_Y + 0.35 * s;
      banana.object3D.rotation.z = rad(720 * p);
      const sc = 1 + 0.3 * s;
      banana.object3D.scale.set(sc, sc, sc);
    });
    // กล้วยลูกใหม่โผล่
    banana.object3D.rotation.z = 0;
    await tween(300, p => {
      banana.object3D.position.y = BANANA_Y;
      banana.object3D.scale.set(p, p, p);
    });
    banana.object3D.scale.set(1, 1, 1);
  }

  async function jump() {
    if (busy || !visible || ended) return;
    busy = true; sfxJump();
    const H = 0.5; let hit = false;

    // ย่อตัวก่อนกระโดด
    await tween(160, p => {
      monkey.object3D.scale.set(1 + .1 * p, 1 - .14 * p, 1 + .1 * p);
      setArms(15 - 25 * p);
    });
    // กระโดด
    await tween(760, p => {
      const s = Math.sin(Math.PI * p);
      monkey.object3D.position.y = H * s;
      monkey.object3D.scale.set(.9 + .06 * s, .86 + .22 * s, .9 + .06 * s);
      setArms(-10 + 170 * s);
      const sh = 1 - .45 * s;
      shadow.object3D.scale.set(sh, sh, sh);
      if (!hit && p >= 0.4) { hit = true; hitBanana(); }
    });
    // ลงพื้น (squash)
    await tween(200, p => {
      const e = Math.sin(Math.PI * p);
      monkey.object3D.position.y = 0;
      monkey.object3D.scale.set(1 + .12 * e * (1 - p), 1 - .14 * e * (1 - p), 1 + .12 * e * (1 - p));
      setArms(-10 + 25 * p);
    });
    monkey.object3D.scale.set(1, 1, 1);
    setArms(15);
    busy = false;
  }

  function rankText(s) {
    if (s >= 200) return '🏆 ราชาลิงโหม่งกล้วย!';
    if (s >= 100) return '🥇 เก่งมาก!';
    if (s >= 50)  return '👍 ใช้ได้เลย!';
    if (s > 0)    return '🐵 เริ่มต้นได้ดี ลองใหม่อีกนะ';
    return '😅 ยังไม่ได้โหม่งเลย ลองใหม่ดูนะ';
  }

  function endGame() {
    if (ended) return;
    ended = true; refreshButtons();
    $('hint').classList.add('hidden');
    $('finalScore').textContent = score;
    $('rank').textContent = rankText(score);
    $('endPanel').classList.add('show');
    sfxWin();
    startFireworks();
  }

  function replay() {
    score = 0; hits = 0; ended = false;
    $('score').textContent = 0; $('count').textContent = '0 ครั้ง';
    $('endPanel').classList.remove('show');
    stopFireworks();
    if (!visible) $('hint').classList.remove('hidden');
    refreshButtons();
  }

  jumpBtn.addEventListener('click', jump);
  endBtn.addEventListener('click', endGame);
  $('replayBtn').addEventListener('click', replay);

  /* ---------- Fireworks (2D canvas overlay) ---------- */
  const cv = $('fw'), cx = cv.getContext('2d');
  let rockets = [], sparks = [], fwOn = false, fwTimer = 0, raf = 0;

  function resize() {
    const d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', resize); resize();

  function launch() {
    rockets.push({
      x: innerWidth * (0.15 + Math.random() * 0.7), y: innerHeight,
      vy: -(8 + Math.random() * 4), targetY: innerHeight * (0.12 + Math.random() * 0.35),
      hue: Math.random() * 360
    });
  }
  function explode(x, y, hue) {
    const n = 70 + (Math.random() * 40 | 0);
    for (let i = 0; i < n; i++) {
      const a = Math.PI * 2 * i / n, sp = 1.5 + Math.random() * 4.5;
      sparks.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1,
        decay: .008 + Math.random() * .012, hue: hue + (Math.random() * 40 - 20)
      });
    }
    beep(180 + Math.random() * 120, .25, 'sawtooth', .04);
  }
  function frame() {
    cx.globalCompositeOperation = 'destination-out';
    cx.fillStyle = 'rgba(0,0,0,0.22)';
    cx.fillRect(0, 0, innerWidth, innerHeight);
    cx.globalCompositeOperation = 'lighter';

    if (fwOn && --fwTimer <= 0) { launch(); if (Math.random() < .5) launch(); fwTimer = 14 + Math.random() * 16; }

    rockets = rockets.filter(r => {
      r.y += r.vy; r.vy *= 0.985;
      cx.beginPath(); cx.arc(r.x, r.y, 2.5, 0, 7);
      cx.fillStyle = `hsl(${r.hue},100%,75%)`; cx.fill();
      if (r.y <= r.targetY || r.vy > -2) { explode(r.x, r.y, r.hue); return false; }
      return true;
    });
    sparks = sparks.filter(s => {
      s.x += s.vx; s.y += s.vy; s.vy += 0.045; s.vx *= 0.985; s.life -= s.decay;
      if (s.life <= 0) return false;
      cx.beginPath(); cx.arc(s.x, s.y, 2.2 * s.life + .4, 0, 7);
      cx.fillStyle = `hsla(${s.hue},100%,60%,${s.life})`; cx.fill();
      return true;
    });

    if (fwOn || rockets.length || sparks.length) raf = requestAnimationFrame(frame);
    else cx.clearRect(0, 0, innerWidth, innerHeight);
  }
  function startFireworks() {
    fwOn = true; fwTimer = 0; cancelAnimationFrame(raf);
    for (let i = 0; i < 4; i++) setTimeout(launch, i * 180);
    raf = requestAnimationFrame(frame);
  }
  function stopFireworks() {
    fwOn = false; rockets = []; sparks = [];
    cancelAnimationFrame(raf); cx.clearRect(0, 0, innerWidth, innerHeight);
  }
})();
</script>
</body>
</html>
